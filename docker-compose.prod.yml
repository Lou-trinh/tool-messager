services:
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  minio: { restart: unless-stopped }
  omnisocial-api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required for production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required for production}
    deploy: { replicas: 1, resources: { limits: { memory: 768M } } }
  omnisocial-worker:
    restart: unless-stopped
    deploy: { replicas: 2, resources: { limits: { memory: 768M } } }
  omnisocial-scheduler:
    restart: unless-stopped
    deploy: { replicas: 1, resources: { limits: { memory: 512M } } }
  omnisocial-frontend: { restart: unless-stopped }
  nginx: { restart: unless-stopped }
