services:
  - type: web
    name: tool-messager-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/render.Dockerfile
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://lou-trinh.github.io
      - key: FRONTEND_URL
        value: https://lou-trinh.github.io/tool-messager
      - key: ZALO_REDIRECT_URI
        value: https://tool-messager-api.onrender.com/api/v1/platforms/zalo/oauth/callback
      - key: DATABASE_URL
        fromDatabase:
          name: tool-messager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tool-messager-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL_DAYS
        value: '30'
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: AUX_HEALTH_HOST
        value: 127.0.0.1
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: tool-messager-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: tool-messager-db
    plan: free
    region: singapore
    databaseName: omnisocial
    user: omnisocial
    postgresMajorVersion: '16'
